<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Песочница — ASMR Box</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <div class="logo"><span class="dot"></span> ASMR Box</div>
    <ul>
      <li><a href="index.html">Главная</a></li>
      <li><a href="pop.html">Плёнка</a></li>
      <li><a href="slime.html">Слайм</a></li>
      <li><a href="squish.html">Сквиш</a></li>
      <li><a href="sand.html" class="active">Песочница</a></li>
    </ul>
  </nav>

  <section class="work" id="sandRoot">
    <a href="index.html" class="back-link">← Все игрушки</a>
    <h1>Песочница</h1>
    <p class="hint">Рисуй пальцем или мышью по песку. Чем быстрее движение — тем громче шорох. Следы остаются.</p>

    <div class="stage">
      <div class="hud">
        <div class="stat">Штрихов: <b id="sandStrokes">0</b></div>
        <div class="stat">Скорость: <b id="sandSpeed">0</b></div>
        <div class="stat">Рекорд: <b id="sandRecord">0</b></div>
      </div>

      <div class="sand-area" id="sandArea">
        <canvas id="sandCanvas"></canvas>
      </div>

      <div class="sand-controls">
        <button id="sandSmoothBtn" type="button">Разровнять</button>
        <button id="sandWaveBtn" type="button">Волны</button>
        <button id="sandResetRecordBtn" type="button">Сбросить рекорд</button>
      </div>
    </div>
  </section>

  <footer>
    <p>ASMR Box · песочница · звук в каждом касании</p>
  </footer>

  <div class="toast" id="toast"></div>

  <script src="audio.js"></script>
  <script src="sand.js"></script>
</body>
</html>
