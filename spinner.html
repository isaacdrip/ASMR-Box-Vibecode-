  <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="logo"><span class="dot"></span> ASMR Box</div>
    <ul>
      <li><a href="index.html">Главная</a></li>
      <li><a href="pop.html">Плёнка</a></li>

  <section class="work" id="spinnerRoot">
    <a href="index.html" class="back-link">← Все игрушки</a>
    <h1>Спиннер-щелкунчик</h1>
    <p class="hint">Крути колесо пальцем или мышью. На каждом секторе — сочный «клик».</p>

    <div class="stage">
      <div class="hud">
        <div class="stat">Обороты: <b id="spinTurns">0</b></div>
        <div class="stat">Клики: <b id="spinClicks">0</b></div>
        <div class="stat">Рекорд: <b id="spinRecord">0</b></div>
      </div>

      <div class="spin-area" id="spinArea">
        <div class="spinner-wheel" id="spinnerWheel">
          <svg viewBox="0 0 200 200" id="spinnerSvg">
            <g id="spinnerGroup">
              <circle cx="100" cy="100" r="94" fill="#e6e0f8" stroke="#4a4458" stroke-width="3"/>
              <path d="M100 100 L100 12 A88 88 0 0 1 176 56 Z" fill="#d8f3ec"/>
              <path d="M100 100 L176 56 A88 88 0 0 1 176 144 Z" fill="#ffe4d6"/>
              <path d="M100 100 L176 144 A88 88 0 0 1 100 188 Z" fill="#fde2e7"/>
              <path d="M100 100 L100 188 A88 88 0 0 1 24 144 Z" fill="#fff3c4"/>
              <path d="M100 100 L24 144 A88 88 0 0 1 24 56 Z" fill="#dcecfb"/>
              <path d="M100 100 L24 56 A88 88 0 0 1 100 12 Z" fill="#c4b8ec"/>
              <circle cx="100" cy="100" r="16" fill="#fffdf9" stroke="#4a4458" stroke-width="3"/>
            </g>
          </svg>
        </div>
      </div>

      <div class="sand-controls" style="margin-top:24px;">
        <button id="spinKickBtn" type="button">Крутить!</button>
        <button id="spinResetBtn" type="button">Сбросить рекорд</button>
      </div>
    </div>
  </section>

  <footer>
    <p>ASMR Box · спиннер · звук в каждом касании</p>
  </footer>

  <div class="toast" id="toast"></div>

  <script src="audio.js"></script>
  <script src="spinner.js"></script>
</body>
</html>
